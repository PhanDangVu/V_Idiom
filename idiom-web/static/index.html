<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>V-Idiom — Tra cứu & Phân tích Thành Ngữ Đa Trục</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0d0f1a;
      --surface: #151829;
      --card: #1c2038;
      --border: #2a3050;
      --accent: #6c63ff;
      --accent2: #48d1cc;
      --green: #4ade80;
      --red: #f87171;
      --ai-from: #ec4899;
      --ai-to: #8b5cf6;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --radius: 14px;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1rem 4rem;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    header h1 {
      font-size: 2.2rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p {
      color: var(--muted);
      margin-top: .4rem;
      font-size: .95rem;
    }

    .container {
      max-width: 780px;
      margin: 0 auto;
    }

    /* ── Search ── */
    .search-box {
      display: flex;
      gap: .6rem;
      margin-bottom: 1.8rem;
    }

    .search-box input {
      flex: 1;
      padding: .85rem 1.2rem;
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 1rem;
      font-family: inherit;
      outline: none;
      transition: border-color .2s;
    }

    .search-box input:focus {
      border-color: var(--accent);
    }

    .search-box input::placeholder {
      color: var(--muted);
    }

    button {
      padding: .85rem 1.3rem;
      border: none;
      border-radius: var(--radius);
      font-family: inherit;
      font-size: .95rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .4rem;
      transition: opacity .2s, transform .15s;
    }

    button:active {
      transform: scale(.97);
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-success {
      background: var(--green);
      color: #0d0f1a;
    }

    .btn-ai {
      background: linear-gradient(135deg, var(--ai-from), var(--ai-to));
      color: #fff;
    }

    .btn-secondary {
      background: var(--border);
      color: var(--text);
    }

    .btn-primary:hover,
    .btn-success:hover,
    .btn-ai:hover,
    .btn-secondary:hover {
      opacity: .88;
    }

    /* ── Card ── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem 1.8rem;
      margin-bottom: 1.2rem;
      animation: fadeIn .3s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .card-title {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: .5rem;
      flex-wrap: wrap;
    }

    .badge {
      display: inline-block;
      padding: .25rem .6rem;
      border-radius: 6px;
      font-size: .75rem;
      font-weight: 600;
    }

    .badge-vn {
      background: rgba(74, 222, 128, .15);
      color: var(--green);
    }

    .badge-en {
      background: rgba(108, 99, 255, .2);
      color: #a5b4fc;
    }

    .badge-csv {
      background: rgba(251, 191, 36, .15);
      color: #fbbf24;
    }

    .badge-ai {
      background: rgba(236, 72, 153, .2);
      color: #f472b6;
    }

    /* ── Criteria Grid ── */
    .criteria-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: .75rem;
      margin: 1.1rem 0;
    }

    .crit-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: .75rem 1rem;
    }

    .crit-label {
      font-size: .72rem;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--muted);
      margin-bottom: .25rem;
    }

    .crit-value {
      font-size: .88rem;
      font-weight: 500;
      color: var(--accent2);
      word-break: break-word;
    }

    /* ── Synonym list ── */
    .synonym-list {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      gap: .5rem;
      margin-top: .4rem;
    }

    .synonym-list li {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: .35rem .75rem;
      font-size: .88rem;
      display: flex;
      align-items: center;
      gap: .35rem;
    }

    .synonym-list li.en-item {
      border-color: rgba(108, 99, 255, .4);
      color: #c7d2fe;
    }

    /* ── Add Form ── */
    .add-form {
      margin-top: 1rem;
    }

    .form-row {
      margin-bottom: 1rem;
    }

    .form-row label {
      display: block;
      font-size: .83rem;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: .35rem;
    }

    .form-row input,
    .form-row select {
      width: 100%;
      padding: .7rem 1rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 9px;
      color: var(--text);
      font-size: .9rem;
      font-family: inherit;
      outline: none;
      transition: border-color .2s;
    }

    .form-row input:focus,
    .form-row select:focus {
      border-color: var(--accent);
    }

    .form-row select option {
      background: var(--surface);
      color: var(--text);
    }

    .form-actions {
      display: flex;
      flex-wrap: wrap;
      gap: .6rem;
      margin-top: 1.2rem;
    }

    .msg {
      margin-top: 1rem;
      padding: .85rem 1.2rem;
      border-radius: 9px;
      font-size: .9rem;
      font-weight: 500;
      text-align: center;
    }

    .msg-ok {
      background: rgba(74, 222, 128, .12);
      color: var(--green);
    }

    .msg-err {
      background: rgba(248, 113, 113, .12);
      color: var(--red);
    }

    #result {
      display: none;
    }
  </style>
</head>

<body>
  <div class="container">

    <header>
      <h1>📖 V-Idiom</h1>
      <p>Hệ thống Tra cứu, Đối chiếu & Phân tích Thành ngữ Đa trục (Ontology + Groq AI)</p>
    </header>

    <!-- Search -->
    <div class="search-box">
      <input id="q" type="text"
        placeholder="Nhập thành ngữ cần tra cứu (VD: Ăn cháo đá bát, Mất bò mới lo làm chuồng)..." autocomplete="off">
      <button class="btn-primary" onclick="search()">🔍 Tra cứu</button>
      <button class="btn-ai" onclick="analyzeWithAI()" title="Phân tích ngữ nghĩa 4 trục bằng Groq Cloud AI">🤖 Groq
        AI</button>
    </div>

    <div id="result"></div>

  </div>

  <script>
    let criteria = {};
    let criteriaLabels = {};

    async function loadCriteria() {
      try {
        const [r1, r2] = await Promise.all([
          fetch('/api/criteria'),
          fetch('/api/criteria-labels'),
        ]);
        criteria = await r1.json();
        criteriaLabels = await r2.json();
      } catch (e) {
        console.warn("Chưa tải được criteria:", e);
      }
    }
    loadCriteria();

    document.getElementById('q').addEventListener('keydown', e => { if (e.key === 'Enter') search(); });

    async function search() {
      const q = document.getElementById('q').value.trim();
      if (!q) return;
      const res = document.getElementById('result');
      res.style.display = 'block';
      res.innerHTML = `<div class="card"><p style="color:var(--muted)">🔍 Đang tra cứu hệ thống...</p></div>`;

      try {
        const r = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
        const data = await r.json();

        if (data.found) {
          renderFoundCard(data);
        } else {
          renderNotFoundCard(data.query);
        }
      } catch (err) {
        res.innerHTML = `<div class="card"><div class="msg msg-err">Lỗi kết nối khi tra cứu: ${err.message}</div></div>`;
      }
    }

    function renderFoundCard(data) {
      const res = document.getElementById('result');
      const langBadge = data.language === 'vn'
        ? `<span class="badge badge-vn">&#x1F1FB;&#x1F1F3; Tiếng Việt</span>`
        : `<span class="badge badge-en">&#x1F1EC;&#x1F1E7; Tiếng Anh</span>`;
      const srcBadge = data.source === 'csv'
        ? `<span class="badge badge-csv">📋 File CSV</span>`
        : `<span class="badge badge-vn">🌐 Bản thể học (Ontology)</span>`;

      const crit = data.criteria || {};
      const critHTML = `
    <div class="criteria-grid">
      ${crit.bc ? `<div class="crit-item"><div class="crit-label">Bối cảnh (BC)</div><div class="crit-value">${criteriaLabels[crit.bc] || crit.bc}</div></div>` : ''}
      ${crit.hd ? `<div class="crit-item"><div class="crit-label">Hành động (HD)</div><div class="crit-value">${criteriaLabels[crit.hd] || crit.hd}</div></div>` : ''}
      ${crit.kq ? `<div class="crit-item"><div class="crit-label">Kết quả (KQ)</div><div class="crit-value">${criteriaLabels[crit.kq] || crit.kq}</div></div>` : ''}
      ${crit.md ? `<div class="crit-item"><div class="crit-label">Mục đích (MD)</div><div class="crit-value">${criteriaLabels[crit.md] || crit.md}</div></div>` : ''}
    </div>`;

      const vns = (data.synonyms_vn || []).map(s => `<li>&#x1F1FB;&#x1F1F3; ${s}</li>`).join('');
      const ens = (data.synonyms_en || []).map(s => `<li class="en-item">&#x1F1EC;&#x1F1E7; ${s}</li>`).join('');
      const synHTML = (vns || ens)
        ? `<div style="margin-top:1rem"><p style="color:var(--muted);font-size:.85rem;margin-bottom:.5rem">Các câu tương đương / đồng nghĩa:</p><ul class="synonym-list">${vns}${ens}</ul></div>`
        : `<p style="color:var(--muted);font-size:.85rem;margin-top:.8rem">Chưa có câu đồng nghĩa nào trong hệ thống.</p>`;

      let meaningHTML = '';
      if (data.meaning_vn) {
        meaningHTML += `<div style="margin-top:.8rem"><p style="color:var(--muted);font-size:.85rem;margin-bottom:.2rem">&#x1F1FB;&#x1F1F3; Giải thích Tiếng Việt:</p><p style="color:white;font-size:0.92rem;font-style:italic;margin-bottom:.4rem">"${data.meaning_vn}"</p></div>`;
      }
      if (data.meaning_en) {
        meaningHTML += `<div style="margin-top:.4rem"><p style="color:var(--muted);font-size:.85rem;margin-bottom:.2rem">&#x1F1EC;&#x1F1E7; Giải thích Tiếng Anh:</p><p style="color:white;font-size:0.92rem;font-style:italic;">"${data.meaning_en}"</p></div>`;
      }

      const note = data.note ? `<p style="color:#fbbf24;font-size:.82rem;margin-top:.8rem">⚠️ ${data.note}</p>` : '';

      res.innerHTML = `
    <div class="card">
      <div class="card-title">✅ ${data.name.replace(/_/g, ' ')} ${langBadge} ${srcBadge}</div>
      ${data.frame ? `<p style="color:var(--muted);font-size:.82rem;margin-bottom:.5rem">Khung Ngữ Nghĩa: <b style="color:var(--accent)">${data.frame}</b></p>` : ''}
      ${meaningHTML}
      ${critHTML}${synHTML}${note}
    </div>`;
    }

    function renderNotFoundCard(query) {
      const res = document.getElementById('result');
      res.innerHTML = `
    <div class="card">
      <div class="card-title">❌ Chưa có thành ngữ "<em>${query}</em>"</div>
      <p style="color:var(--muted);margin-bottom:1.2rem;font-size:.9rem">
        Thành ngữ này chưa tồn tại trong Ontology hoặc CSV. Bạn có thể sử dụng Groq Cloud AI để dịch, phân tích cấu trúc 4 trục và tự động lưu.
      </p>
      <div style="display:flex;gap:.6rem;margin-bottom:1.2rem;flex-wrap:wrap">
        <button class="btn-ai" onclick="analyzeWithAI('${query.replace(/'/g, "\\'")}')">🤖 Phân tích với Groq AI</button>
        <button class="btn-success" onclick="autoProcessAI('${query.replace(/'/g, "\\'")}')">⚡ Tự động Lưu vào Ontology + CSV (1 chạm)</button>
      </div>
      ${buildAddForm(query)}
    </div>`;
    }

    async function analyzeWithAI(customIdiom) {
      const idiom = customIdiom || document.getElementById('q').value.trim();
      if (!idiom) {
        alert("Vui lòng nhập thành ngữ cần phân tích!");
        return;
      }
      const res = document.getElementById('result');
      res.style.display = 'block';
      res.innerHTML = `<div class="card"><p style="color:var(--accent2)">🤖 Đang gửi thành ngữ "<strong>${idiom}</strong>" đến Groq Cloud API để phân tích 4 trục...</p></div>`;

      try {
        const r = await fetch('/api/ai/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ idiom: idiom })
        });
        const result = await r.json();
        if (!result.ok) {
          res.innerHTML = `<div class="card"><div class="msg msg-err">${result.detail || "Lỗi khi gọi AI"}</div></div>`;
          return;
        }
        const d = result.data;
        renderAIAnalysisCard(d);
      } catch (err) {
        res.innerHTML = `<div class="card"><div class="msg msg-err">Lỗi kết nối Groq: ${err.message}</div></div>`;
      }
    }

    function renderAIAnalysisCard(d) {
      const res = document.getElementById('result');
      
      const ketQuaDanhGia = d.Kết_Quả_Đánh_Giá || "";
      const isNew = ketQuaDanhGia === "KHUNG_MỚI";
      const tc = isNew ? (d.Bộ_Tiêu_Chí_Khung_Mới || {}) : (d.Bộ_Tiêu_Chí_Khung || {});
      const stt = isNew ? d.Mã_Khung_STT_Khởi_Tạo : d.Mã_Khung_STT;
      const vnMeaning = isNew ? (d.Giải_Thích_Nghĩa_Đề_Xuất?.Tiếng_Việt || "") : (d.Giải_Thích_Nghĩa_Gốc?.Tiếng_Việt || "");
      const enMeaning = isNew ? (d.Giải_Thích_Nghĩa_Đề_Xuất?.Tiếng_Anh || "") : (d.Giải_Thích_Nghĩa_Gốc?.Tiếng_Anh || "");
      
      const synonyms = d.Các_Câu_Đồng_Nghĩa_Cùng_Khung || { Tiếng_Việt: [], Tiếng_Anh: [] };
      const vns = (synonyms.Tiếng_Việt || []).map(s => `<li>&#x1F1FB;&#x1F1F3; ${s}</li>`).join('');
      const ens = (synonyms.Tiếng_Anh || []).map(s => `<li class="en-item">&#x1F1EC;&#x1F1E7; ${s}</li>`).join('');

      let badgeHtml = isNew 
        ? `<span class="badge badge-ai" style="background:#f59e0b;color:#fff">⚠️ KHUNG MỚI (STT: ${stt})</span>`
        : `<span class="badge badge-ai" style="background:#10b981;color:#fff">✅ KHUNG ĐÃ TỒN TẠI (STT: ${stt})</span>`;

      res.innerHTML = `
    <div class="card">
      <div class="card-title">
        🤖 Kết quả đối soát Ontology ${badgeHtml}
      </div>
      <p style="font-size:1.05rem;margin-bottom:.5rem">
        🇻🇳 <strong>${d.Thành_Ngữ_Mới_Nhập}</strong>
      </p>
      
      ${d.Thông_Báo ? `<div style="color:#f59e0b; font-size:0.9rem; margin-bottom:1rem;"><i>${d.Thông_Báo}</i></div>` : ''}

      <div style="margin: .7rem 0">
        <p style="color:var(--muted);font-size:.85rem">🇻🇳 Ý nghĩa Tiếng Việt:</p>
        <p style="color:white;font-style:italic;margin-bottom:.4rem">"${vnMeaning || '—'}"</p>
        <p style="color:var(--muted);font-size:.85rem">🇬🇧 Ý nghĩa Tiếng Anh:</p>
        <p style="color:white;font-style:italic;">"${enMeaning || '—'}"</p>
      </div>

      <div style="margin:.7rem 0">
        <p style="color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.3rem">Bộ Khung Tiêu Chí (Semantic Frame):</p>
        <div class="criteria-grid">
          <div class="crit-item"><div class="crit-label">Bối cảnh (BC)</div><div class="crit-value">${criteriaLabels[tc.Bối_cảnh] || tc.Bối_cảnh || '—'}</div></div>
          <div class="crit-item"><div class="crit-label">Hành động (HD)</div><div class="crit-value">${criteriaLabels[tc.Hành_động] || tc.Hành_động || '—'}</div></div>
          <div class="crit-item"><div class="crit-label">Kết quả (KQ)</div><div class="crit-value">${criteriaLabels[tc.Kết_quả] || tc.Kết_quả || '—'}</div></div>
          <div class="crit-item"><div class="crit-label">Mục đích (MD)</div><div class="crit-value">${criteriaLabels[tc.Mục_đích] || tc.Mục_đích || '—'}</div></div>
        </div>
      </div>

      ${(vns || ens) 
        ? `<div style="margin-top:1rem;margin-bottom:1rem"><p style="color:var(--muted);font-size:.85rem;margin-bottom:.5rem">Các câu tương đương / đồng nghĩa (Cùng chia sẻ Khung ${stt}):</p><ul class="synonym-list">
             ${vns}
             ${ens}
           </ul></div>`
        : `<p style="color:var(--muted);font-size:.85rem;margin-top:.8rem;margin-bottom:1rem">Chưa có câu đồng nghĩa nào trong hệ thống.</p>`}

    </div>`;
    }

    async function saveAIResult(data) {
      const msgEl = document.getElementById('ai_save_msg');
      msgEl.innerHTML = `<div class="msg" style="color:var(--accent2)">Đang lưu vào Ontology RDF và File CSV...</div>`;

      const payload = {
        thanh_ngu_vn: data.Thanh_ngu_VN,
        thanh_ngu_en: data.Thanh_ngu_EN,
        boi_canh: data.Tieu_chi?.Boi_canh || "",
        hanh_dong: data.Tieu_chi?.Hanh_dong || "",
        ket_qua: data.Tieu_chi?.Ket_qua || "",
        muc_dich: data.Tieu_chi?.Muc_dich || "",
        giai_thich_vn: data.Giai_thich_ngan || "",
        giai_thich_en: data.Giai_thich_EN || ""
      };

      try {
        const r = await fetch('/api/ai/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const res = await r.json();
        if (!res.ok) {
          msgEl.innerHTML = `<div class="msg msg-err">${res.detail || "Lỗi khi lưu dữ liệu!"}</div>`;
          return;
        }

        const vns = (res.synonyms_vn || []).map(s => `<li>🇻🇳 ${s}</li>`).join('');
        const ens = (res.synonyms_en || []).map(s => `<li class="en-item">🇬🇧 ${s}</li>`).join('');
        msgEl.innerHTML = `
      <div class="msg msg-ok">
        ${res.msg} <br>
        (Đã gắn vào Khung: <strong>${res.frame}</strong>, STT CSV: <strong>${res.stt}</strong>)
      </div>
      ${(vns || ens) ? `<div style="margin-top:.8rem"><p style="color:var(--muted);font-size:.85rem">Các thành ngữ đồng nghĩa trong Khung:</p><ul class="synonym-list">${vns}${ens}</ul></div>` : ''}
    `;
        loadCriteria();
      } catch (err) {
        msgEl.innerHTML = `<div class="msg msg-err">Lỗi kết nối khi lưu: ${err.message}</div>`;
      }
    }

    async function autoProcessAI(idiom) {
      const res = document.getElementById('result');
      res.style.display = 'block';
      res.innerHTML = `<div class="card"><p style="color:var(--accent2)">⚡ Đang tự động phân tích và lưu trữ thành ngữ "<strong>${idiom}</strong>"...</p></div>`;

      try {
        const r = await fetch('/api/ai/auto-process', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ idiom: idiom })
        });
        const data = await r.json();
        if (!data.ok) {
          res.innerHTML = `<div class="card"><div class="msg msg-err">${data.detail || "Lỗi tự động hoá!"}</div></div>`;
          return;
        }

        const tc = data.tieu_chi || {};
        const vns = (data.synonyms_vn || []).map(s => `<li>🇻🇳 ${s}</li>`).join('');
        const ens = (data.synonyms_en || []).map(s => `<li class="en-item">🇬🇧 ${s}</li>`).join('');

        res.innerHTML = `
      <div class="card">
        <div class="card-title">🎉 Tự động phân tích & Lưu thành công! <span class="badge badge-ai">STT: ${data.stt}</span></div>
        <p style="font-size:1.05rem;margin-bottom:.4rem">
          🇻🇳 <strong>${data.thanh_ngu_vn}</strong>
        </p>
        <p style="color:var(--muted);font-size:.82rem;margin-bottom:.6rem">Khung Ontology: <b style="color:var(--accent)">${data.frame}</b></p>
        
        ${data.sac_thai ? `<div style="background:var(--surface);border-left:3px solid var(--accent);padding:.6rem .9rem;border-radius:6px;margin:.7rem 0"><p style="color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.05em">Sắc thái & Ý nghĩa:</p><p style="color:#e2e8f0;font-size:.88rem;margin-top:.2rem">${data.sac_thai}</p></div>` : ''}
        ${data.co_che ? `<div style="background:rgba(59, 130, 246, 0.08);border-left:3px solid #3b82f6;padding:.6rem .9rem;border-radius:6px;margin:.7rem 0"><p style="color:#60a5fa;font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;font-weight:600">⭐ Cơ chế nhân - quả:</p><p style="color:#e2e8f0;font-size:.88rem;margin-top:.2rem">${data.co_che}</p></div>` : ''}

        <div style="margin: .6rem 0">
          <p style="color:var(--muted);font-size:.85rem">🇻🇳 Ý nghĩa tiếng Việt: <em>"${data.giai_thich_vn}"</em></p>
          <p style="color:var(--muted);font-size:.85rem">🇬🇧 English Meaning: <em>"${data.giai_thich_en}"</em></p>
        </div>

        <div class="criteria-grid">
          <div class="crit-item"><div class="crit-label">Bối cảnh</div><div class="crit-value">${criteriaLabels[tc.Boi_canh] || tc.Boi_canh || '—'}</div></div>
          <div class="crit-item"><div class="crit-label">Hành động</div><div class="crit-value">${criteriaLabels[tc.Hanh_dong] || tc.Hanh_dong || '—'}</div></div>
          <div class="crit-item"><div class="crit-label">Kết quả</div><div class="crit-value">${criteriaLabels[tc.Ket_qua] || tc.Ket_qua || '—'}</div></div>
          <div class="crit-item"><div class="crit-label">Mục đích</div><div class="crit-value">${criteriaLabels[tc.Muc_dich] || tc.Muc_dich || '—'}</div></div>
        </div>

        ${data.phan_bien ? `<div style="background:rgba(245, 158, 11, 0.08);border-left:3px solid #f59e0b;padding:.6rem .9rem;border-radius:6px;margin:.7rem 0"><p style="color:#fbbf24;font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;font-weight:600">⚖️ Phản biện:</p><p style="color:#e2e8f0;font-size:.88rem;margin-top:.2rem">${data.phan_bien}</p></div>` : ''}
        ${data.kiem_tra_nguoc ? `<div style="background:rgba(16, 185, 129, 0.08);border-left:3px solid #10b981;padding:.6rem .9rem;border-radius:6px;margin:.7rem 0"><p style="color:#34d399;font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;font-weight:600">🔄 Kiểm tra ngược:</p><p style="color:#e2e8f0;font-size:.88rem;margin-top:.2rem">${data.kiem_tra_nguoc}</p></div>` : ''}

        ${(vns || ens) ? `<div style="margin-top:.8rem"><p style="color:var(--muted);font-size:.85rem">Các câu đồng nghĩa:</p><ul class="synonym-list">${vns}${ens}</ul></div>` : ''}
      </div>`;
        loadCriteria();
      } catch (err) {
        res.innerHTML = `<div class="card"><div class="msg msg-err">Lỗi: ${err.message}</div></div>`;
      }
    }

    function buildAddForm(prefill) {
      const makeSelect = (key, label) => {
        const opts = (criteria[key] || []).map(v => {
          const displayLabel = criteriaLabels[v] || v;
          return `<option value="${v}">${displayLabel}</option>`;
        }).join('');
        return `
      <div class="form-row">
        <label>${label}</label>
        <select id="f_${key}" onchange="previewSynonyms()">
          <option value="">(Không chọn)</option>
          ${opts}
        </select>
      </div>`;
      };

      return `
    <div class="add-form" id="manual_add_form">
      <h3 style="font-size:1rem;color:var(--accent2);margin-bottom:.8rem">Hoặc nhập thủ công vào hệ thống:</h3>
      <div class="form-row">
        <label>Thành ngữ Tiếng Việt (VN)</label>
        <input id="f_name" value="${prefill.replace(/ /g, '_')}" placeholder="Ví dụ: Mat_bo_moi_lo_lam_chuong">
      </div>
      <div class="form-row">
        <label>Thành ngữ Tiếng Anh (EN)</label>
        <input id="f_name_en" placeholder="Ví dụ: Lock_the_stable_door_after_the_horse_is_stolen">
      </div>
      <div class="form-row">
        <label>Giải thích nghĩa Tiếng Việt</label>
        <input id="f_giai_thich" placeholder="Ví dụ: Mất mát rồi mới tìm cách đề phòng...">
      </div>
      <div class="form-row">
        <label>Giải thích nghĩa Tiếng Anh (English Meaning)</label>
        <input id="f_giai_thich_en" placeholder="Ví dụ: To take precautions after damage is already done...">
      </div>
      ${makeSelect('boi_canh', 'Bối cảnh (BC)')}
      ${makeSelect('hanh_dong', 'Hành động (HD)')}
      ${makeSelect('ket_qua', 'Kết quả (KQ)')}
      ${makeSelect('muc_dich', 'Mục đích (MD)')}

      <div id="synonym-preview" style="display:none">
        <div style="border-top:1px solid var(--border);margin:.4rem 0 .8rem"></div>
        <p style="font-size:.82rem;color:var(--muted);margin-bottom:.5rem">
          🔍 Đồng nghĩa theo tiêu chí đang chọn:
        </p>
        <ul class="synonym-list" id="synonym-preview-list"></ul>
      </div>

      <div class="form-actions">
        <button class="btn-success" onclick="saveManualForm()">💾 Lưu vào Bản thể học & CSV</button>
      </div>
      <div id="add_msg"></div>
    </div>`;
    }

    function fillFormFromAI(d) {
      const f_name = document.getElementById('f_name');
      if (!f_name) {
        document.getElementById('result').innerHTML += buildAddForm(d.Thanh_ngu_VN);
      }
      document.getElementById('f_name').value = (d.Thanh_ngu_VN || '').replace(/ /g, '_');
      document.getElementById('f_name_en').value = (d.Thanh_ngu_EN || '').replace(/ /g, '_');
      document.getElementById('f_giai_thich').value = d.Giai_thich_ngan || '';
      document.getElementById('f_giai_thich_en').value = d.Giai_thich_EN || '';

      const tc = d.Tieu_chi || {};
      if (tc.Boi_canh) document.getElementById('f_boi_canh').value = tc.Boi_canh;
      if (tc.Hanh_dong) document.getElementById('f_hanh_dong').value = tc.Hanh_dong;
      if (tc.Ket_qua) document.getElementById('f_ket_qua').value = tc.Ket_qua;
      if (tc.Muc_dich) document.getElementById('f_muc_dich').value = tc.Muc_dich;
      previewSynonyms();
      document.getElementById('manual_add_form')?.scrollIntoView({ behavior: 'smooth' });
    }

    async function previewSynonyms() {
      const bc = document.getElementById('f_boi_canh')?.value || '';
      const hd = document.getElementById('f_hanh_dong')?.value || '';
      const kq = document.getElementById('f_ket_qua')?.value || '';
      const md = document.getElementById('f_muc_dich')?.value || '';

      const previewBox = document.getElementById('synonym-preview');
      const previewList = document.getElementById('synonym-preview-list');
      if (!previewBox || !previewList) return;

      if (!bc && !hd && !kq && !md) {
        previewBox.style.display = 'none';
        return;
      }

      const params = new URLSearchParams();
      if (bc) params.set('boi_canh', bc);
      if (hd) params.set('hanh_dong', hd);
      if (kq) params.set('ket_qua', kq);
      if (md) params.set('muc_dich', md);

      const r = await fetch(`/api/preview-synonyms?${params}`);
      const data = await r.json();

      const vns = (data.synonyms_vn || []).map(s => `<li>&#x1F1FB;&#x1F1F3; ${s}</li>`).join('');
      const ens = (data.synonyms_en || []).map(s => `<li class="en-item">&#x1F1EC;&#x1F1E7; ${s}</li>`).join('');

      if (vns || ens) {
        const frames = data.matched_frames.join(', ');
        previewList.innerHTML = `
      <li style="font-size:.75rem;color:var(--muted);border:none;background:none;padding:.2rem 0">
        Khung khớp: <b style="color:var(--accent)">${frames}</b>
      </li>${vns}${ens}`;
        previewBox.style.display = 'block';
      } else {
        previewList.innerHTML = `<li style="color:var(--muted);font-style:italic">
      Chưa có câu đồng nghĩa nào khớp với tiêu chí đã chọn.
    </li>`;
        previewBox.style.display = 'block';
      }
    }

    async function saveManualForm() {
      const name_vn = document.getElementById('f_name').value.trim();
      const name_en = document.getElementById('f_name_en').value.trim();
      const boi_canh = document.getElementById('f_boi_canh').value;
      const hanh_dong = document.getElementById('f_hanh_dong').value;
      const ket_qua = document.getElementById('f_ket_qua').value;
      const muc_dich = document.getElementById('f_muc_dich').value;
      const gt_vn = document.getElementById('f_giai_thich').value.trim();
      const gt_en = document.getElementById('f_giai_thich_en').value.trim();

      const msgEl = document.getElementById('add_msg');
      if (!name_vn || !name_en) {
        msgEl.innerHTML = `<div class="msg msg-err">Vui lòng nhập cả Thành ngữ Tiếng Việt và Tiếng Anh!</div>`;
        return;
      }

      const payload = {
        thanh_ngu_vn: name_vn,
        thanh_ngu_en: name_en,
        boi_canh: boi_canh,
        hanh_dong: hanh_dong,
        ket_qua: ket_qua,
        muc_dich: muc_dich,
        giai_thich_vn: gt_vn,
        giai_thich_en: gt_en
      };

      const r = await fetch('/api/ai/save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await r.json();

      if (!data.ok) {
        msgEl.innerHTML = `<div class="msg msg-err">${data.detail || data.msg}</div>`;
        return;
      }

      const vns = (data.synonyms_vn || []).map(s => `<li>&#x1F1FB;&#x1F1F3; ${s}</li>`).join('');
      const ens = (data.synonyms_en || []).map(s => `<li class="en-item">&#x1F1EC;&#x1F1E7; ${s}</li>`).join('');

      msgEl.innerHTML = `
    <div class="msg msg-ok">${data.msg} (Khung: <strong>${data.frame}</strong>)</div>
    ${(vns || ens) ? `<div style="margin-top:.8rem"><p style="color:var(--muted);font-size:.85rem">Các câu đồng nghĩa:</p><ul class="synonym-list">${vns}${ens}</ul></div>` : ''}`;
      loadCriteria();
    }
  </script>
</body>

</html>
